# Groups Configuration
# Defines logical groups of stages that are executed together
# Groups are executed in the order they appear in this file

groups:
  initial_preparation:
    name: "Initial Preparation"
    description: "Basic system setup and database deployments before marker creation"
    deployed_with: [databases]
    dependencies: []  # No dependencies - this is the first group
    stages:
      - name: setup_hosts_local
        function: setup_hosts_locally
        module: tasks.setup_hosts
        description: "Configure /etc/hosts, SSHD, and root password on raptor (local)"
        args:
          debug: false

      - name: setup_hosts_remote
        function: setup_hosts_on_remote_machine
        module: tasks.setup_hosts
        description: "Configure /etc/hosts, SSHD, and root password on all remote machines"
        args:
          debug: false
        
      - name: update_system_packages
        function: update_system_packages
        module: tasks.preparation_for_services_deployment
        description: "Update system packages on raptor (excluding kernel)"
        args:
          debug: false

      - name: prepare_upload_content
        function: prepare_upload_content
        module: tasks.preparation_for_services_deployment
        description: "Create upload directory, download source_files from IBM COS, clone guardium_notes_dbtraffic"
        args:
          cos_prefix: "V14"
          debug: false

      - name: configure_dbtraffic
        function: configure_dbtraffic
        module: tasks.preparation_for_services_deployment
        description: "Configure guardium_notes_dbtraffic (yaml configs, venv, deps) on raptor"
        args:
          debug: false

      - name: configure_swap
        function: configure_swap
        module: tasks.preparation_for_services_deployment
        description: "Configure 8G swap file on raptor"
        args:
          debug: false

      - name: install_packages_on_sauropod
        function: install_packages_on_sauropod
        module: tasks.preparation_for_services_deployment
        description: "Install kernel-devel, Java 11 and podman on sauropod via SSH"
        args:
          debug: false

      - name: create_demo_user_on_ceratops
        function: create_demo_user_on_ceratops
        module: tasks.setup_hosts
        description: "Create 'demo' user on ceratops (Windows) via SSH as itzuser, add to Administrators"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          demo_username: "demo"
          debug: false

      - name: copy_files_to_ceratops
        function: copy_files_to_ceratops
        module: tasks.setup_hosts
        description: "Create bootcamp desktop dir and SCP gim + shell agent dirs from raptor to ceratops"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          dest_dir: 'C:\bootcamp'
          source_dirs:
            - "/opt/guardium_tz_bootcamp_automation/upload/source_files/agents/gim"
            - "/opt/guardium_tz_bootcamp_automation/upload/source_files/agents/zip"
            - "/opt/guardium_tz_bootcamp_automation/upload/source_files/windows/software"
          debug: false

      - name: install_edge_on_ceratops
        function: install_edge_on_ceratops
        module: tasks.setup_hosts
        description: "Install Microsoft Edge Enterprise (silent, /qn /norestart) on ceratops via SSH as itzuser"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          msi_path: 'C:\bootcamp\software\MicrosoftEdgeEnterpriseX64.msi'
          debug: false

      - name: create_bookmarks_on_ceratops
        function: create_bookmarks_on_ceratops
        module: tasks.setup_hosts
        description: "Create Edge managed bookmarks via registry and kill msedge process on ceratops"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          debug: false

      - name: configure_hosts_on_ceratops
        function: configure_hosts_on_ceratops
        module: tasks.setup_hosts
        description: "Append all environment machines to C:\\Windows\\System32\\drivers\\etc\\hosts on ceratops via SSH"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          debug: false

      - name: configure_timezone_on_ceratops
        function: configure_timezone_on_ceratops
        module: tasks.setup_hosts
        description: "Set timezone on ceratops via SSH (tzutil /s) and verify"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          debug: false

      - name: configure_mssql_on_ceratops
        function: configure_mssql_on_ceratops
        module: tasks.setup_hosts
        description: "Enable SA login and set SA password on MSSQLSERVER on ceratops (only if MSSQLSERVER is Running)"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          debug: false

      - name: restore_adventureworks_on_ceratops
        function: restore_adventureworks_on_ceratops
        module: tasks.setup_hosts
        description: "Restore AdventureWorks2019.bak to MSSQL on ceratops via sqlcmd"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          bak_file: 'c:\bootcamp\software\AdventureWorks2019.bak'
          debug: false

      - name: setup_fam_files_on_raptor
        function: setup_fam_files_on_raptor
        module: tasks.setup_hosts
        description: "Create /FAM/{Protected,Controlled} on raptor, copy FAM files, chmod -R 2777 /FAM"
        args:
          debug: false

      - name: setup_fam_files_on_ceratops
        function: setup_fam_files_on_ceratops
        module: tasks.setup_hosts
        description: "Create users tom/jerry, C:\\FAMGUARD\\{Privileged,Controlled}, upload FAM files, icacls Everyone on ceratops"
        args:
          ceratops_machine: "ceratops"
          ssh_username: "itzuser"
          debug: false

      - name: RDP_relay_setup
        function: RDP_relay_setup
        module: tasks.setup_hosts
        description: "Create /etc/systemd/system/socat-RDP.service forwarding 8443 -> ceratops:51124, daemon-reload"
        args:
          debug: false

  database_preparations:
    name: "Standard databases installation"
    description: "setup DB engines on bootcamp machines"
    deployed_with: [databases]
    dependencies: [initial_preparation]  # Requires initial_preparation to be completed
    stages:
      - name: deploy_mysql_on_raptor
        function: deploy_mysql_on_raptor
        module: tasks.deploy_mysql
        description: "Deploy MySQL 9.7 on raptor"
        args:
          debug: false
      
      - name: deploy_mongo_on_raptor
        function: deploy_mongo_on_raptor
        module: tasks.deploy_mongo
        description: "Deploy MongoDB 8.3 on raptor with SSL/TLS"
        args:
          debug: false

      - name: deploy_postgres_on_raptor
        function: deploy_postgres_on_raptor
        module: tasks.deploy_postgres
        description: "Install postgres 16 on raptor"
        args:
          debug: false
      
      - name: setup_oracle_container_on_sauropod
        function: setup_oracle_container_on_sauropod
        module: tasks.deploy_oracle
        description: "Deploy Oracle 21c in the container"
        args:
          image_source_path: "/opt/guardium_tz_bootcamp_automation/upload/source_files/oracle/oracle_db_21c_image_with_oua.tar.gz"
          debug: false

      - name: deploy_oracle_on_sauropod
        function: deploy_oracle_on_sauropod
        module: tasks.deploy_oracle
        description: "Deploy Oracle 21c on sauropod"
        args:
          debug: false
      
      - name: deploy_db2_on_raptor
        function: deploy_db2_on_raptor
        module: tasks.deploy_db2
        description: "Install Db2 11.5 on raptor"
        args:
          debug: false
      
      - name: deploy_cassandra_on_sauropod
        function: deploy_cassandra_on_sauropod
        module: tasks.deploy_cassandra
        description: "Deploy Apache Cassandra 4.1 on sauropod"
        args:
          debug: false

      - name: deploy_informix_on_raptor
        function: deploy_informix
        module: tasks.deploy_informix
        description: "Full Informix deployment: kernel, user, binaries, config, storage, network, init, firewall, service"
        args:
          installer_filename: "ibm.server.15.0.1.0.Linux.64.x86_64.tar"
          installer_source_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/informix"
          install_tmp_dir: "/opt/informix_tmp"
          install_dir: "/opt/ibm/informix"
          informix_server: "ifxserver"
          informix_host: "raptor.demo.guardium"
          informix_port: 9088
          informix_admin_port: 9089
          rootdbs_size_kb: 200000
          jdbc_jars: "/opt/guardium_tz_bootcamp_automation/upload/source_files/informix/jdbc-15.0.1.3.jar:/opt/guardium_tz_bootcamp_automation/upload/source_files/informix/bson-4.11.1.jar"
          debug: false

  setup_appliances:
    name: "Setup Appliances"
    description: "Configure Guardium appliances (collector, CM, etc.)"
    deployed_with: [appliances]
    dependencies: [initial_preparation]
    stages:
      - name: reset_cli_password_all
        function: reset_cli_password_all
        module: tasks.setup_appliances
        description: "Reset CLI password on all appliances using cloudsupport account and sudo (parallel execution)"
        args:
          # cloudsupport_password: "password"  # Optional - defaults to cloudsupport_pwd from custom_variables
          # cli_password: "password"  # Optional - defaults to cli_pwd from custom_variables
          debug: false
      
      - name: create_oauth_client
        function: create_oauth_client
        module: tasks.setup_appliances
        description: "Create OAuth client and save client_secret to .client_secret file"
        args:
          appliance_name: "cm"
          client_id: "BOOTCAMP"
          debug: false
           
      - name: create_demo_user
        function: create_demo_user
        module: tasks.setup_appliances
        description: "Create demo user in Guardium via REST API"
        args:
          appliance_name: "cm"  # Name from config/appliances.yaml
          debug: false
          
      - name: configure_system_settings_all
        function: configure_system_settings_all
        module: tasks.setup_appliances
        description: "CONSOLIDATED: Configure ALL system settings in single CLI session per appliance (hostname, domain, small_disk, timeouts, network IP, timezone, NTP, hosts resolving, product GID). Executes in parallel (max 20), CM → Collectors → AppNodes order."
        args:
          debug: false
      
      - name: set_shared_secret_all
        function: set_shared_secret_all
        module: tasks.setup_appliances
        description: "Set shared secret on all appliances (parallel execution). Uses 'shared_secret' from custom_variables, defaults to 'guardium' if not found."
        args:
          # shared_secret: "guardium"  # Optional - defaults to shared_secret from custom_variables or "guardium"
          debug: false
      
      - name: configure_aggregation_settings_all
        function: configure_aggr_settings_all
        module: tasks.setup_appliances
        description: "Configure aggregation settings on all appliances: run_cleanup_orphans_daily off, purge_age_period 0 (parallel execution)"
        args:
          debug: false

      # - name: prepare_log_guard_dir_all (REMOVE IN 12.2.3)
      #   function: prepare_log_guard_dir_all
      #   module: tasks.setup_appliances
      #   description: "Create /var/log/guard (2775 root:guardium) and jobqueue.log (644 tomcat:guardium) on all appliances"
      #   args:
      #     debug: false

      - name: restart_all_appliances_after_initial_setup
        function: restart_appliance_all
        module: tasks.setup_appliances
        description: "Restart ALL appliances after initial setup (async with max 20 parallel)"
        args:
          debug: false
          wait_for_availability: true
          retry_interval: 15  # Seconds between retry attempts (default: 10)
          max_retries: 40  # Maximum retry attempts (default: 60, total timeout = 40 * 15 = 600s = 10min)

      - name: set_unit_type_manager
        function: set_unit_type_manager
        module: tasks.setup_appliances
        description: "Set unit type to manager via CLI"
        args:
          appliance_name: "cm"
          debug: false
      
      - name: register_appliances_on_cm
        function: register_appliances_all
        module: tasks.setup_appliances
        description: "Register all Collectors and AppNodes on Central Manager sequentially (one by one, 10 min timeout per appliance)"
        args:
          cm_port: 8443
          timeout: 240  # 4 minutes per appliance
          debug: false

      - name: restart_all_appliances_after_managed_by_cm
        function: restart_appliance_all
        module: tasks.setup_appliances
        description: "Restart ALL appliances after initial setup (async with max 20 parallel)"
        args:
          debug: false
          wait_for_availability: true
          retry_interval: 15  # Seconds between retry attempts (default: 10)
          max_retries: 40  # Maximum retry attempts (default: 60, total timeout = 40 * 15 = 600s = 10min)
      
      - name: import_definitions_on_cm
        function: import_definitions_on_cm
        module: tasks.setup_appliances
        description: "Import definitions (default policy and full SQL report) to CM via REST API"
        args:
          cm_appliance: "cm"
          definitions_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/exports/"
          debug: false

      - name: prepare_appliances_for_patching
        function: prepare_appliances_for_patching_all
        module: tasks.setup_appliances
        description: "Prepare ALL appliances for patching by copying *.sig files to /var/log/guard/patches/ (parallel execution, max 20)"
        args:
          patches_source_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/appliances/patches/"
          debug: false

      - name: install_and_monitor_patches_all
        function: install_and_monitor_patches_all
        module: tasks.setup_appliances
        description: "Install and monitor patches on ALL appliances in parallel (max 20). Automatically gets patch order from CM if not specified."
        args:
          reinstall_answer: "y"  # Answer to reinstall question (default: "y")
          check_interval: 120  # Seconds between status checks (default: 60)
          max_checks: 60  # Maximum number of checks before timeout (default: 60 = 1 hour with 60s interval)
          debug: false
      
      - name: install_policy_on_collector
        function: install_policy_on_collector
        module: tasks.setup_appliances
        description: "Install policy on collector via REST API"
        args:
          cm_appliance: "cm"
          collector_appliance: "coll1"
          policy_name: "Default bootcamp policy"
          debug: false

  gim_lab:
    name: "GIM Lab"
    description: "Install GIM on raptor, import GIM modules, and install STAP agent"
    deployed_with: [gim]
    dependencies: [setup_appliances]  # Requires initial_preparation and setup_appliances
    stages:
     
      - name: import_gim_modules
        function: import_gim_modules
        module: tasks.agent_labs
        description: "Import GIM module files to Guardium appliance"
        args:
          appliance_name: "cm"
          demo_user: "demo"
          gim_directory: "/opt/guardium_tz_bootcamp_automation/upload/source_files/agents/gim"
          gim_target_dir: "/var/dump"
          debug: false
      
  atap_lab:
    name: "ATAP Lab"
    description: "Bootcamp state after ATAP lab"
    deployed_with: [agents]
    dependencies: [gim_lab]  # Requires initial_preparation to be completed
    stages:
      
      - name: install_gim_on_raptor
        function: install_gim_on_raptor
        module: tasks.agent_labs
        description: "Install GIM (Guardium Installation Manager) on raptor machine"
        args:
          gim_installer_path: "/opt/guardium_tz_bootcamp_automation/upload/source_files/agents/shell/guard-bundle-GIM-12.2.2.0_r123489_v12_x_1-rhel-9-linux-x86_64.gim.sh"
          debug: false
    
      - name: install_stap_on_raptor
        function: install_stap_on_raptor
        module: tasks.agent_labs
        description: "Install STAP (S-TAP) agent on raptor using GIM"
        args:
          appliance_name: "cm"
          collector_name: "coll1"
          module: "BUNDLE-STAP"
          module_version: "12.2.2.0_r123489_3"
          use_tls: "1"
          statistics: "-3"
          connection_pool_size: "2"
          debug: false

      - name: enable_atap_for_postgres_on_raptor
        function: enable_atap_for_postgres_on_raptor
        module: tasks.agent_labs
        description: "Enable ATAP (Application Transparent Access Protection) for PostgreSQL on raptor"
        args:
          db_user: "postgres"
          db_home: "/usr"
          db_user_dir: "/var/lib/pgsql"
          db_type: "postgres"
          db_instance: "postgres"
          db_version: "16"
          debug: false

      - name: correct_mysql_ie
        function: correct_mysql_ie
        module: tasks.agent_labs
        description: "Correct MySQL Inspection Engine definitions"
        args:
          cm_appliance: "cm"
          collector_appliance: "coll1"
          debug: false

      - name: enable_atap_for_mongo
        function: enable_atap_for_mongo
        module: tasks.agent_labs
        description: "Enable ATAP for MongoDB on raptor"
        args:
          debug: false

      - name: import_verification_definitions
        function: import_verification_definitions
        module: tasks.agent_labs
        description: "Import ATAP lab definitions to CM via REST API"
        args:
          cm_appliance: "cm"
          definitions_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/exports/"
          debug: false

      - name: set_stap_network_latency
        function: set_stap_network_latency
        module: tasks.agent_labs
        description: "Set STAP network latency on coll1 (store stap network_latency 10)"
        args:
          collector_appliance: "coll1"
          latency: 10
          debug: false

      - name: stop_databases_atap
        function: stop_databases_atap
        module: tasks.agent_labs
        description: "Stop and disable mongod and informix-ifxserver services on raptor"
        args:
          debug: false

  exit_lab:
    name: "Exit Lab"
    description: "Configure DB2 exit for Guardium monitoring"
    deployed_with: [agents]
    dependencies: [atap_lab]
    stages:
      - name: configure_db2_exit
        function: db2_exit_configuration
        module: tasks.agent_labs
        description: "Configure DB2 exit for Guardium monitoring on raptor"
        args:
          debug: false
      
      - name: configure_db2_exit_ie
        function: configure_db2_exit_ie
        module: tasks.agent_labs
        description: "Configure DB2 Exit Inspection Engine on collector"
        args:
          cm_appliance: "cm"
          collector_appliance: "coll1"
          debug: false

  uc1_lab:
    name: "UC 1.0 lab"
    description: "Universal Connector 1.0 lab setup"
    deployed_with: []
    dependencies: [exit_lab]
    stages:
      - name: install_filebeat_on_sauropod
        function: install_filebeat_on_sauropod
        module: tasks.uc_labs
        description: "Install and configure Filebeat on sauropod for Cassandra audit logs"
        args:
          debug: false

  etap_lab:
    name: "ETAP Lab"
    description: "Setup raptor for External TAP (ETAP) deployment"
    deployed_with: [agents]
    dependencies: [exit_lab]
    stages:
      - name: setup_raptor_to_deploy_etap
        function: setup_raptor_to_deploy_etap
        module: tasks.etap_labs
        description: "Install required packages and determine latest ETAP version for deployment"
        args:
          local_tar: "/opt/guardium_tz_bootcamp_automation/upload/source_files/images/guardium_external_s-tap_v12.2.4.tar" # used only if repo is not working
          debug: false

      - name: setup_etap_certificates_mysql
        function: setup_etap_certificates_mysql
        module: tasks.etap_labs
        description: "Create CA, generate CSR, sign certificate, and import ETAP certificates for MySQL to collector"
        args:
          etap_locality: "Nowa Sol"
          etap_state: "Lubuskie"
          etap_email: "guardadmin@gmail.com"
          debug: false

      - name: deploy_etap_mysql
        function: deploy_etap_mysql
        module: tasks.etap_labs
        description: "Add SSH port 22, restart sshd, clone Guardium External S-TAP, deploy mysql-etap container"
        args:
          debug: false

  va_basics:
    name: "VA Basics Lab"
    description: "Enable Vulnerability Assessment feature and basic VA lab setup"
    deployed_with: [standard_demo]
    dependencies: [etap_lab]
    stages:
      
      - name: enable_vulnerability_management
        function: enable_vulnerability_management
        module: tasks.va_labs
        description: "Enable VULNERABILITY_MANAGEMENT feature flag on CM and verify State=ENABLED"
        args:
          debug: false

      - name: create_va_postgres_account
        function: create_va_postgres_account
        module: tasks.va_labs
        description: "Create sqlguard user, gdmmonitor group and grant VA monitoring privileges on PostgreSQL (raptor)"
        args:
          debug: false

      - name: import_va_postgres_definitions
        function: import_va_postgres_definitions
        module: tasks.va_labs
        description: "Import VA security assessment definitions for PostgreSQL on raptor to CM"
        args:
          cm_appliance: "cm"
          definitions_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/exports/"
          debug: false

      - name: import_dps
        function: import_dps
        module: tasks.va_labs
        description: "Upload and import DPS file via Guardium Web UI (Playwright): Harden → Vulnerability Assessment → Customer Uploads"
        args:
          debug: false

      - name: fetch_cm_certificate_on_sauropod
        function: fetch_cm_certificate_on_sauropod
        module: tasks.va_labs
        description: "Fetch CM TLS certificate from cm.demo.guardium:8443 and save to /root/gn-trainings/vascanner/certs/vascanner.pem on sauropod"
        args:
          cert_path: "/root/gn-trainings/vascanner/certs/vascanner.pem"
          debug: false

      - name: create_va_api_key
        function: create_va_api_key
        module: tasks.va_labs
        description: "Create VA API key 'vascanner' on CM via grdapi and save to .va_api_key"
        args:
          debug: false

      - name: deploy_vascanner_on_sauropod
        function: deploy_vascanner_on_sauropod
        module: tasks.va_labs
        description: "Login to cp.icr.io, pull va-scanner image, write config, run container on sauropod"
        args:
          image: "cp.icr.io/cp/ibm-guardium-data-security-center/guardium/vascanner-12.2.0/va-scanner:vascanner-v12.2.0"
          container_name: "va-scanner-sauropod"
          config_file: "/opt/vascanner/config"
          certs_dir: "/root/gn-trainings/vascanner/certs"
          va_agent_name: "VA_SCANNER_ON_SAUROPOD"
          debug: false

  winstap_lab:
    name: "WinSTAP Lab"
    description: "Windows STAP lab - prepare ceratops for GIM/STAP installation"
    deployed_with: [standard_demo]
    dependencies: [va_basics]
    stages:
      - name: extract_zip_on_ceratops
        function: extract_zip_on_ceratops
        module: tasks.windows_labs
        description: "Extract GIM-Installer zip on ceratops to C:\\bootcamp"
        args:
          zip_path: 'C:\bootcamp\zip\GIM-Installer-12.2_r120202259_1.zip'
          dest_dir: 'C:\bootcamp\gim_unpacked'
          debug: false

      - name: install_gim_on_ceratops
        function: install_gim_on_ceratops
        module: tasks.windows_labs
        description: "Run Setup.exe unattended to install GIM client on ceratops"
        args:
          setup_exe: 'C:\bootcamp\gim_unpacked\Setup.exe'
          appliance: "cm.demo.guardium"
          debug: false

      - name: install_winstap_on_ceratops
        function: install_winstap_on_ceratops
        module: tasks.windows_labs
        description: "Install WINSTAP module on ceratops via GIM API with WINSTAP_SQLGUARD_IP=coll1"
        args:
          module_version: "12.2_r120202259_1"
          debug: false

  fam_lab:
    name: "FAM Lab"
    description: "File Activity Monitoring lab - configure FAM on raptor"
    deployed_with: []
    dependencies: [winstap_lab]
    stages:
      - name: configure_fam_on_raptor
        function: configure_fam_on_raptor
        module: tasks.fam_labs
        description: "Set STAP_FAM_ENABLED, STAP_FAM_INSTALLED, STAP_UID_CHAIN_SSHD_IP, STAP_UID_CHAIN_TRACE on raptor, schedule and monitor"
        args:
          cm_appliance: "cm"
          installation_delay: 10
          debug: false

      - name: import_fam_policy
        function: import_fam_policy
        module: tasks.fam_labs
        description: "Import FAM policy definitions from exp_fam_policy.sql to CM"
        args:
          cm_appliance: "cm"
          definitions_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/exports/"
          debug: false

      - name: install_fammonitor_on_ceratops
        function: install_fammonitor_on_ceratops
        module: tasks.fam_labs
