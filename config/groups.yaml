  edge_lab:
    name: "Edge Lab"
    description: "Install Edge patch on CM and configure Edge features"
    deployed_with: [new_architecture]
    dependencies: []
    stages:
      - name: prepare_cm_for_edge_patching  
        function: copy_single_file_to_appliance_task
        module: tasks.setup_appliances
        description: "Copy Edge patch file to cm for installation"
        args:
          appliance_name: "cm"
          source_file_path: "/opt/guardium_tz_bootcamp_automation/upload/source_files/appliances/extensions/SqlGuard-12.0p15003_Edge_Jun_26_2026.tgz.enc.sig"
          debug: false

      - name: install_edge_patch_on_cm
        function: install_edge_patch_via_api
        module: tasks.edge_labs
        description: "Initiate Edge patch installation on cm via REST API patch_install"
        args:
          cm_appliance: "cm"
          patch_filename: "SqlGuard-12.0p15002_Edge_Apr_14_2026.tgz.enc.sig"
          mode: "local_only"
          debug: false

      - name: monitor_edge_patch_on_cm
        function: monitor_patch_installation
        module: core.appliance_operations
        description: "Monitor Edge patch installation on cm: wait for appear (15s), then DONE (60s)"
        args:
          appliance_name: "cm"
          patch_numbers: ["15002"]
          appear_interval: 15
          appear_max: 40
          check_interval: 60
          max_checks: 60
          debug: false

      - name: install_k3s_on_sauropod
        function: install_k3s_on_sauropod
        module: tasks.edge_labs
        description: "Install k3s v1.32.13+k3s1 on sauropod (--disable traefik), wait for 3 pods Running, patch CoreDNS"
        args:
          k3s_version: "v1.32.13+k3s1"
          cm_appliance: "cm"
          expected_pods: 3
          max_wait: 300
          check_interval: 15
          debug: false

      - name: register_edge_gateway
        function: register_edge_gateway
        module: tasks.edge_labs
        description: "Register Edge gateway on CM via REST API POST /restAPI/register_edge"
        args:
          cm_appliance: "cm"
          exports_to: "cm.demo.guardium"
          name: "sauropod.demo.guardium"
          namespace: "edge"
          storageclass_rw_once: "local-path"
          version: "v2.1.1"
          deploy_proxy: true
          debug: false

      - name: download_edge_bundle_via_api
        function: download_edge_bundle_via_api
        module: tasks.edge_labs
        description: "Download edge bundle from CM REST API get_bundle, save as /tmp/edge.tar.gz on sauropod"
        args:
          cm_appliance: "cm"
          edge_name: "sauropod.demo.guardium"
          sauropod_dest: "/tmp/edge.tar.gz"
          debug: false

      - name: prepare_sauropod_for_edge
        function: prepare_sauropod_for_edge
        module: tasks.edge_labs
        description: "Add firewall-cmd rules (6443/tcp, 8472/udp, 10250/tcp, masquerade) on raptor, install expect on sauropod"
        args:
          debug: false

      - name: deploy_edge_gateway
        function: deploy_edge_gateway
        module: tasks.edge_labs
        description: "Run edge-install.sh from /tmp/sauropod.demo.guardium with TTY"
        args:
          edge_dir: "/tmp/sauropod.demo.guardium"
          install_script: "edge-install.sh"
          script_timeout: 600
          debug: false

      - name: monitor_edge_gateway_deployment
        function: monitor_edge_gateway_deployment
        module: tasks.edge_labs
        description: "Wait for edge-manager pod, then monitor logs until EDGE_SERVICES_INSTALLATION_STATUS is Completed"
        args:
          namespace: "edge"
          pod_prefix: "edge-manager"
          appear_interval: 15
          appear_max: 40
          log_interval: 30
          log_max: 60
          debug: false

      - name: install_policy_on_sauropod
        function: install_policy_on_sauropod
        module: tasks.edge_labs
        description: "Install 'Default bootcamp policy' on sauropod via REST API (units param)"
        args:
          cm_appliance: "cm"
          policy_name: "Default bootcamp policy"
          units: "sauropod.demo.guardium"
          install_action: "install_override"
          debug: false

      - name: import_edge_dashboard
        function: import_edge_dashboard
        module: tasks.edge_labs
        description: "Import Edge dashboard from exports/exp_dashboard_edge.sql"
        args:
          cm_appliance: "cm"
          definitions_dir: "/opt/guardium_tz_bootcamp_automation/upload/source_files/exports/"
          debug: false

      - name: configure_stap_for_edge_on_ceratops
        function: configure_stap_for_edge_on_ceratops
        module: tasks.edge_labs
        description: "Get haproxy NodePorts 9800/9801 from sauropod k3s, set WINSTAP params via GIM API on ceratops, schedule install"
        args:
          cm_appliance: "cm"
          installation_delay: 10
          debug: false
